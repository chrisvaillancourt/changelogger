[project]
name = "changelogger"
version = "0.1.0"
description = "CLI to fetch release notes between tags"
authors = [
    { name = "Chris Vaillancourt", email = "github@chrisvaillancourt.io" }
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=4.2.4",
    "httpx>=0.28.1",
]

[project.scripts]
changelogger = "changelogger.cli:app"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
